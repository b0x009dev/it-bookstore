# Include inside the existing server block.

location = /it-store {
    return 301 /it-store/$is_args$args;
}

location = /it-store/pr-03 {
    return 301 /it-store/pr-03/$is_args$args;
}

location ^~ /it-store/pr-03/ {
    alias /var/www/it-bookstore/pr-03/demo/;
    index tables.html;
}

# Reserve this prefix for published bookstore demos.
location ^~ /it-store/ {
    return 404;
}

location = /tables {
    return 301 /it-store/pr-03/tables.html$is_args$args;
}

location = /tables.html {
    return 301 /it-store/pr-03/tables.html$is_args$args;
}

location = /queries {
    return 301 /it-store/pr-03/queries.html$is_args$args;
}

location = /queries.html {
    return 301 /it-store/pr-03/queries.html$is_args$args;
}
